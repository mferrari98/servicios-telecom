# Docker Compose para orquestación de servicios
# Gestiona Nginx como proxy reverso y red compartida
#
# Estructura esperada del proyecto:
# ~/servicios-telecom/
# ├── docker-compose.yml     # Orquestación de servicios
# ├── cont-nginx/            # (repo) - Configuración de Nginx
# │   ├── nginx.conf         # Configuración principal
# │   ├── conf.d/            # Configuraciones de virtual hosts
# │   └── ssl/               # Certificados SSL
# ├── cont-portal/           # (repo) - Aplicación React
# ├── cont-guardias/         # (repo) - Aplicación Flask
# ├── cont-empa/             # (repo) - Aplicación React EMPA
# ├── cont-reportespiolis/   # (repo) - Aplicación Node.js Reportes
# └── scripts/               # Scripts de gestión

services:
  nginx:
    build:
      context: ./cont-nginx
    image: servicios-telecom-nginx
    container_name: cont-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./cont-nginx/htpasswd:/etc/nginx/htpasswd:ro                  # Basic auth users
      - ./logs/nginx:/var/log/nginx                                  # Logs persistentes (sin rotacion)
    environment:
      - FLASK_HOST=${FLASK_HOST:-cont-guardias}  # Host del contenedor Flask
      - FLASK_PORT=${FLASK_PORT:-5000}  # Puerto del contenedor Flask
      - PORTAL_SERVICIOS_HOST=${PORTAL_SERVICIOS_HOST:-cont-portal}  # Host del portal de servicios
      - PORTAL_SERVICIOS_PORT=${PORTAL_SERVICIOS_PORT:-80}  # Puerto del portal de servicios
      - EMPA_HOST=${EMPA_HOST:-cont-empa}  # Host del contenedor EMPA
      - EMPA_PORT=${EMPA_PORT:-80}  # Puerto del contenedor EMPA
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proyectos_network

  portal-servicios:
    build:
      context: ./cont-portal
      dockerfile: Dockerfile
    image: servicios-telecom-portal
    container_name: cont-portal
    expose:
      - "80"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - proyectos_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/health.html >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sistema-guardias:
    build:
      context: ./cont-guardias
      dockerfile: Dockerfile
    image: servicios-telecom-guardias
    container_name: cont-guardias
    expose:
      - "5000"
    env_file:
      - ./cont-guardias/.env  # Cargar variables de entorno desde la carpeta del proyecto
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - proyectos_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sistema-empa:
    build:
      context: ./cont-empa
      dockerfile: Dockerfile
    image: servicios-telecom-empa
    container_name: cont-empa
    expose:
      - "80"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - proyectos_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sistema-reportespiolis:
    build:
      context: ./cont-reportespiolis
      dockerfile: Dockerfile
    image: servicios-telecom-reportespiolis
    container_name: cont-reportespiolis
    expose:
      - "3000"
    volumes:
      - /mnt/compartido:/mnt/compartido:ro  # Montar directorio compartido como solo lectura
      - ./cont-reportespiolis/data:/app/data  # Base de datos SQLite persistente
      - ./logs/reportespiolis:/logs/reportespiolis                   # Logs persistentes (sin rotacion)
    environment:
      - DB_PATH=/app/data/database.sqlite
    env_file:
      - ./cont-reportespiolis/.env  # Usar el archivo .env existente en cont-reportespiolis
    command: ["sh", "-c", "npm start"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proyectos_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sistema-monitor-recursos:
    build:
      context: ./cont-monitor-recursos
      dockerfile: Dockerfile
    image: servicios-telecom-monitor-recursos
    container_name: cont-monitor-recursos
    expose:
      - "80"
    volumes:
      - ./logs/nginx:/logs/nginx:ro
      - ./logs/reportespiolis:/logs/reportespiolis:ro
    environment:
      - MONITOR_API_TOKEN=${MONITOR_API_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - proyectos_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proyectos_network:
    driver: bridge
